# Copier template for Phenomenon Studio projects.
#   create:  pnpm dlx @phenomenon-studio/create-app my-app   (or: uvx copier copy --trust gh:Phenomenon-Studio/phenomenon-configs my-app)
#   update:  pnpm dlx @phenomenon-studio/create-app update   (or: uvx copier update --trust --skip-answered)
#
# Layout: template/project/ holds files every project gets. Layers live in folders named
# {{ '.' if <condition> else '' }} — the folder renders to "." when the condition holds (merged into the project root)
# and to "" otherwise (skipped): one per stack, plus one per Vite styling approach.
# Files ending in .jinja are rendered; everything else is copied
# verbatim. Versions come from template/versions.jinja.

_min_copier_version: '9.5'
_subdirectory: template/project
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
# .claude/skills/* link to .agents/skills/*; keep them as links in generated projects.
_preserve_symlinks: true
_skip_if_exists:
    - .env.local

project_name:
    type: str
    help: Package name (kebab-case)
    validator: >-
        {% if not (project_name | regex_search('^[a-z0-9][a-z0-9-]*$')) %}Use kebab-case: lowercase letters, digits and dashes{% endif %}

project_title:
    type: str
    help: Human-readable title (README, <title>)
    default: "{{ project_name | replace('-', ' ') | title }}"

stack:
    type: str
    help: Framework
    choices:
        Vite (React SPA, TanStack Router + Query + Form): vite
        Next.js (App Router, CSS Modules): next

styling:
    type: str
    help: Styling approach
    choices:
        Tailwind CSS + shadcn/ui: tailwind
        CSS Modules: css-modules
    # Only Vite offers the choice today; Next.js ships CSS Modules (recorded so templates can branch on `styling`).
    default: "{{ 'tailwind' if stack == 'vite' else 'css-modules' }}"
    when: "{{ stack == 'vite' }}"

# Skipped with --skip-tasks (examples/ are regenerated that way inside the platform workspace).
_tasks:
    - command: git init --quiet
      when: "{{ _copier_operation == 'copy' }}"
    - command: pnpm install
    - command: pnpm exec husky
      when: "{{ _copier_operation == 'copy' }}"

_message_after_copy: |
    Created {{ project_title }} ({{ stack }}, {{ styling }}).

    Next steps:
      cd {{ _copier_conf.dst_path }}
      cp .env.local.example .env.local
      git add -A && git commit -m "chore: scaffold from phenomenon-configs"

    Keep .copier-answers.yml committed: it records the template version used for updates.
