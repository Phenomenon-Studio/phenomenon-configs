name: Template update

on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    update:
        # Opens a PR when phenomenon-configs has a newer template release than .copier-answers.yml records.
        uses: Phenomenon-Studio/phenomenon-configs/.github/workflows/template-update.yml@v1
        secrets:
            # Org secret: a token that can read Phenomenon-Studio/phenomenon-configs and open PRs here.
            TEMPLATE_TOKEN: ${{ secrets.PLATFORM_TEMPLATE_TOKEN }}
