# CLI package: Changesets opens a "Version packages" PR; merging it publishes to npmjs.com.
# Publishing uses npm trusted publishing (OIDC, `id-token: write`), so no npm token is stored anywhere. Configure it
# once per package on npmjs.com → package settings → Trusted publishing → GitHub Actions
# (Phenomenon-Studio/phenomenon-configs, workflow release.yml).
name: Release packages

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            # Trusted publishing needs npm >= 11.5.1.
            - run: npm install --global npm@11
            - run: pnpm install --frozen-lockfile
            - uses: changesets/action@v2
              with:
                  version: pnpm version-packages
                  publish: pnpm release-packages
                  title: 'chore(release): version packages'
                  commit: 'chore(release): version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
