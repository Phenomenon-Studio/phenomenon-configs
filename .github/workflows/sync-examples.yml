# Renovate edits template/versions.jinja but cannot run Copier (hosted app has no post-upgrade tasks).
# Re-render examples/ on its branches and push, so the drift check and example builds test the new versions.
name: Sync examples

on:
    push:
        branches: ['renovate/**']
        paths: ['template/**', 'copier.yml']

permissions:
    contents: write

jobs:
    regen:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
            - run: pnpm install --no-frozen-lockfile
            - run: pnpm examples:regen
            - run: pnpm install --no-frozen-lockfile
            - name: Commit regenerated examples
              run: |
                  git add -A examples pnpm-lock.yaml
                  git diff --cached --quiet && exit 0
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "build(examples): regenerate from template"
                  git push
